<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toko Online Sederhana</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 20px; color: #1f2a44; }
    h1 { text-align: center; margin-bottom: 20px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    #produkPanel { flex: 2; min-width: 300px; }
    #keranjangPanel { flex: 1; min-width: 280px; }

    .produk { display: flex; justify-content: space-between; align-items: center;
              padding: 12px 0; border-bottom: 1px solid #e6e9f2; }
    .produk:last-child { border-bottom: none; }
    .produk .harga { color: #555; font-size: 14px; }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px;
             background: #2a5298; color: #fff; font-size: 14px; }
    button:hover { background: #1e3c72; }
    button.kecil { padding: 3px 9px; }
    button.hapus { background: #c0392b; }
    button.hapus:hover { background: #962d22; }
    button.checkout { width: 100%; margin-top: 15px; padding: 12px; font-size: 16px; background: #27ae60; }
    button.checkout:hover { background: #1e8449; }
    button.batal { background: #7f8c8d; }
    button.batal:hover { background: #636e72; }

    .item { padding: 10px 0; border-bottom: 1px solid #e6e9f2; }
    .item .nama { font-weight: bold; }
    .item .kontrol { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
    .kosong { color: #888; font-style: italic; }
    .total-box { margin-top: 15px; padding-top: 10px; border-top: 2px solid #2a5298; font-size: 18px; }
    #cartTotal { font-weight: bold; }
    #cartTotal del { color: #888; font-size: 14px; font-weight: normal; }
    .badge-diskon { color: #27ae60; font-size: 13px; font-weight: normal; }
    .error { color: red; display: none; font-size: 13px; }
    #modalPembeli { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; }
    #modalPembeli .modal-box { background: #fff; max-width: 400px; margin: 8% auto; padding: 20px;
                               border-radius: 10px; }
    #modalPembeli input, #modalPembeli textarea { width: 100%; padding: 8px; margin-top: 4px;
                               border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
    #modalPembeli p { margin: 12px 0; }
    #modalPembeli .aksi { display: flex; gap: 8px; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>🛒 Toko Online Sederhana</h1>

  <div class="container">
    <div class="panel" id="produkPanel">
      <h2>Daftar Produk</h2>
      <div id="daftarProduk"></div>
    </div>

    <div class="panel" id="keranjangPanel">
      <h2>Keranjang (<span id="cartCount">0</span>)</h2>
      <div id="cartItems"></div>
      <div class="total-box">
        Total: <span id="cartTotal">Rp 0</span>
      </div>
      <button class="checkout" id="btnCheckout">Checkout</button>
    </div>
  </div>

  <div id="modalPembeli">
    <div class="modal-box">
      <h3>Data Pembeli</h3>
      <p>Nama<br>
        <input type="text" id="namaPembeli">
        <span class="error" id="errNamaP">Nama minimal 3 karakter</span>
      </p>
      <p>Alamat<br>
        <textarea id="alamatPembeli" rows="3"></textarea>
        <span class="error" id="errAlamat">Alamat minimal 10 karakter</span>
      </p>
      <p>No HP<br>
        <input type="text" id="hpPembeli" placeholder="contoh: 081234567890">
        <span class="error" id="errHp">No HP 10-13 angka, diawali 08</span>
      </p>
      <div class="aksi">
        <button id="btnKonfirmasi">Konfirmasi</button>
        <button class="batal" id="btnBatal">Batal</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {

      const produk = [
        { id: 1, nama: 'Kaos Polos',     harga: 55000 },
        { id: 2, nama: 'Topi Baseball',  harga: 35000 },
        { id: 3, nama: 'Tas Ransel',     harga: 150000 },
        { id: 4, nama: 'Sepatu Sneaker', harga: 275000 },
        { id: 5, nama: 'Botol Minum',    harga: 25000 }
      ];

      let cart = []; 
      function tampilkanProduk() {
        let html = '';
        produk.forEach(function (p) {
          html += `
            <div class="produk">
              <div>
                <div><b>${p.nama}</b></div>
                <div class="harga">Rp ${p.harga.toLocaleString('id-ID')}</div>
              </div>
              <button class="btnTambah" data-id="${p.id}">+ Tambah</button>
            </div>`;
        });
        $('#daftarProduk').html(html);
      }

      function updateCartUI() {
        if (cart.length === 0) {
          $('#cartItems').html('<p class="kosong">Keranjang masih kosong</p>');
        } else {
          let html = '';
          cart.forEach(function (item) {
            html += `
              <div class="item">
                <div class="nama">${item.nama}</div>
                <div>Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}
                     = Rp ${(item.harga * item.qty).toLocaleString('id-ID')}</div>
                <div class="kontrol">
                  <button class="kecil btnKurang" data-id="${item.id}">-</button>
                  <span>${item.qty}</span>
                  <button class="kecil btnTambahQty" data-id="${item.id}">+</button>
                  <button class="kecil hapus btnHapus" data-id="${item.id}">Hapus</button>
                </div>
              </div>`;
          });
          $('#cartItems').html(html);
        }

        let totalHarga = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

        if (totalHarga > 100000) {
          const diskon = totalHarga * 0.1;
          const totalAsli = totalHarga;
          totalHarga -= diskon;

          $('#cartTotal').html(`
            <del>Rp ${totalAsli.toLocaleString('id-ID')}</del><br>
            Rp ${totalHarga.toLocaleString('id-ID')}
            <span class="badge-diskon">(diskon 10%)</span>
          `);
        } else {
          $('#cartTotal').html(`Rp ${totalHarga.toLocaleString('id-ID')}`);
        }

        $('#cartCount').text(cart.reduce((sum, item) => sum + item.qty, 0));
      }

      function hitungTotalAkhir() {
        let total = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
        if (total > 100000) {
          total -= total * 0.1;
        }
        return total;
      }

      function simpanRiwayat(total, qty) {
        const riwayat = JSON.parse(localStorage.getItem('riwayat')) || [];
        riwayat.push({ tanggal: new Date().toISOString(), total, qty });
        localStorage.setItem('riwayat', JSON.stringify(riwayat));
      }

      function tambahKeKeranjang(id) {
        const ada = cart.find(item => item.id === id);
        if (ada) {
          ada.qty++;
        } else {
          const p = produk.find(x => x.id === id);
          cart.push({ id: p.id, nama: p.nama, harga: p.harga, qty: 1 });
        }
        updateCartUI();
      }

      function kurangiQty(id) {
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.qty--;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
        updateCartUI();
      }

      function hapusItem(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
      }

      function resetFormPembeli() {
        $('#namaPembeli, #hpPembeli').val('');
        $('#alamatPembeli').val('');
        $('#errNamaP, #errAlamat, #errHp').hide();
      }

      $('#daftarProduk').on('click', '.btnTambah', function () {
        tambahKeKeranjang(Number($(this).data('id')));
      });

      $('#cartItems').on('click', '.btnTambahQty', function () {
        tambahKeKeranjang(Number($(this).data('id')));
      });

      $('#cartItems').on('click', '.btnKurang', function () {
        kurangiQty(Number($(this).data('id')));
      });

      $('#cartItems').on('click', '.btnHapus', function () {
        hapusItem(Number($(this).data('id')));
      });
      $('#btnCheckout').click(function () {
        if (cart.length === 0) {
          alert('Keranjang masih kosong');
          return;
        }
        $('#modalPembeli').fadeIn();
      });

      $('#btnBatal').click(function () {
        $('#modalPembeli').fadeOut();
      });

      $('#btnKonfirmasi').click(function () {
        let valid = true;

        if ($('#namaPembeli').val().trim().length < 3) {
          $('#errNamaP').show(); valid = false;
        } else { $('#errNamaP').hide(); }

        if ($('#alamatPembeli').val().trim().length < 10) {
          $('#errAlamat').show(); valid = false;
        } else { $('#errAlamat').hide(); }

        if (!/^08\d{8,11}$/.test($('#hpPembeli').val().trim())) {
          $('#errHp').show(); valid = false;
        } else { $('#errHp').hide(); }

        if (valid) {
          const totalAkhir = hitungTotalAkhir();
          const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);

          simpanRiwayat(totalAkhir, totalQty); 

          cart = [];
          updateCartUI();
          resetFormPembeli();
          $('#modalPembeli').fadeOut();
          alert('Pesanan berhasil! Total dibayar: Rp ' + totalAkhir.toLocaleString('id-ID'));
        }
      });
      
      tampilkanProduk();
      updateCartUI();
    });
  </script>
</body>
</html>
